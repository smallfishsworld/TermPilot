[project]
name = "termpilot"
version = "1.0.0"
description = "Backend for TermPilot: campus data sync, timetable, tasks, mail and an LLM assistant."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  # web and data
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "psycopg2-binary>=2.9",
  "pyjwt>=2.8",
  "cryptography>=42",
  "tzdata>=2024.1",
  # campus integrations and mail
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  # language models and search
  "openai>=1.40",
  "elasticsearch>=8.11,<9",
  "elasticsearch-dsl>=8.11,<9",
  # document engine
  "numpy>=1.26",
  "pandas>=2.1",
  "xxhash>=3.4",
  "tiktoken>=0.7",
  "nltk>=3.8",
  "hanziconv>=0.3.2",
  "chardet>=5.2",
  "pillow>=10.3",
  "markdown>=3.6",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "openpyxl>=3.1",
  "readability-lxml>=0.8.1",
  "html-text>=0.6",
  "pdfplumber>=0.11",
  "pypdf>=4.2",
  "onnxruntime>=1.18",
  "opencv-python-headless>=4.9",
  "xgboost>=2.0",
  "shapely>=2.0",
  "pyclipper>=1.3",
  "huggingface-hub>=0.23",
  "roman-numbers>=1.0.2",
  "word2number>=1.1",
  "cn2an>=0.5",
  "datrie>=0.8.2; platform_system != 'Windows' and python_version < '3.13'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
termpilot = "termpilot.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["termpilot*"]

[tool.setuptools.package-data]
termpilot = ["campus/codebook.json", "knowledge/engine/store/es_mapping.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:pdfminer.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
# The adapted document engine keeps its upstream style; see THIRD_PARTY_NOTICES.md.
extend-exclude = ["termpilot/knowledge/engine"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF100"]
ignore = ["E501", "B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
